version: "3.1"
rules:
- rule: Say goodbye anytime the user says goodbye
  steps:
    - intent: goodbye
    - action: utter_goodbye

- rule: Say 'I am a bot' anytime the user challenges
  steps:
    - intent: bot_challenge
    - action: utter_iamabot

- rule: Activate gift form
  steps:
    - intent: ask_gift_recommendation
    - action: gift_form
    - active_loop: gift_form

- rule: Submit gift form
  condition:
    - active_loop: gift_form
  steps:
    - action: gift_form
    - active_loop: null
    - slot_was_set:
        - requested_slot: null
    - action: action_recommend_gift

- rule: Handle occasion slot
  steps:
    - intent: provide_occasion
    - action: action_set_occasion
    - slot_was_set:
        - occasion: "birthday"

- rule: Handle recipient type slot
  steps:
    - intent: provide_recipient_type
    - action: action_set_recipient_type
    - slot_was_set:
        - recipient_type: "all"

